  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@300;400;500&display=swap');

    :root {
      --ink:      #0e0e0e;
      --paper:    #f5f1eb;
      --accent:   #c84b31;
      --muted:    #7a7570;
      --rule:     #d4cfc8;
      --hover-bg: #ece8e1;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 16px; scroll-behavior: smooth; }

    body {
      background: var(--paper);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      font-weight: 300;
      min-height: 100vh;
      padding: 0 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Grid wrapper ─────────────────────────────────────── */
    .page {
      width: 100%;
      max-width: 780px;
      padding: 4rem 0 6rem;
    }

    /* ── Header / masthead ────────────────────────────────── */
    header {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 2rem;
      align-items: start;
      padding-bottom: 2.5rem;
      border-bottom: 1px solid var(--rule);
      margin-bottom: 3rem;
      opacity: 0;
      animation: fadeUp .6s ease forwards;
    }

    .avatar {
      width: 88px;
      height: 88px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--rule);
      flex-shrink: 0;
    }

    .headline { display: flex; flex-direction: column; gap: .35rem; }

    h1 {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 400;
      letter-spacing: -.01em;
      line-height: 1;
    }

    .tagline {
      font-size: .78rem;
      color: var(--muted);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    /* ── Section ──────────────────────────────────────────── */
    section {
      margin-bottom: 2.8rem;
      opacity: 0;
      animation: fadeUp .6s ease forwards;
    }
    section:nth-child(2) { animation-delay: .1s; }
    section:nth-child(3) { animation-delay: .2s; }
    section:nth-child(4) { animation-delay: .3s; }

    .section-label {
      font-size: .68rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 1rem;
    }

    /* ── Links list ───────────────────────────────────────── */
    .links { list-style: none; display: flex; flex-direction: column; gap: .1rem; }

    .links a {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      padding: .65rem .5rem;
      text-decoration: none;
      color: var(--ink);
      border-radius: 4px;
      transition: background .15s, color .15s;
      position: relative;
    }
    .links a:hover { background: var(--hover-bg); }
    .links a:hover .link-label { color: var(--accent); }

    .link-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      opacity: .5;
      margin-top: 2px;
    }

    .link-label {
      font-size: .88rem;
      font-weight: 500;
      transition: color .15s;
    }

    .link-desc {
      font-size: .78rem;
      color: var(--muted);
      margin-left: auto;
    }

    /* ── Rule dividers ────────────────────────────────────── */
    .rule { border: none; border-top: 1px solid var(--rule); margin: 2rem 0; }

    /* ── Footer ───────────────────────────────────────────── */
    footer {
      padding-top: 2rem;
      border-top: 1px solid var(--rule);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .72rem;
      color: var(--muted);
      gap: 1rem;
      flex-wrap: wrap;
      opacity: 0;
      animation: fadeUp .6s .4s ease forwards;
    }

    footer a { color: var(--muted); text-decoration: underline; text-decoration-color: transparent; transition: text-decoration-color .2s; }
    footer a:hover { text-decoration-color: var(--muted); }

    /* ── Animations ───────────────────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ───────────────────────────────────────── */
    @media (max-width: 480px) {
      header { grid-template-columns: 1fr; }
      .avatar { width: 64px; height: 64px; }
      .link-desc { display: none; }
    }
  </style>
</head>
